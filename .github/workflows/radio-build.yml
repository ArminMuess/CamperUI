name: CamperUI Radio Firmware

on:
  workflow_dispatch:
    inputs:
      crash_run_id:
        description: 'Nur Absturz entschlüsseln: Run-ID des Builds, der abgestürzt ist'
        required: false
        default: ''
      backtrace:
        description: 'Nur Absturz entschlüsseln: PC und Backtrace-Adressen (0x... 0x...)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'

      - name: Install tools and libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          exec > >(tee build/setup.log) 2>&1
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib install 'lvgl@8.4.0' 'GFX Library for Arduino@1.6.9' SensorLib ArduinoJson ESP32_IO_Expander ESP32_Display_Panel
          cp CamperUI/config/lv_conf.h "$HOME/Arduino/libraries/lv_conf.h"
          arduino-cli version
          arduino-cli core list
          arduino-cli lib list

      - name: Download debug symbols of the crashed build
        if: inputs.backtrace != ''
        uses: actions/download-artifact@v4
        with:
          name: CamperUI-Radio-Debug-ELF
          run-id: ${{ inputs.crash_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: crash

      - name: Decode crash backtrace
        if: inputs.backtrace != ''
        shell: bash
        env:
          BACKTRACE: ${{ inputs.backtrace }}
        run: |
          set -euo pipefail
          A2L=$(find "$HOME/.arduino15/packages/esp32/tools" -name '*esp32s3-elf-addr2line' -o -name 'xtensa-esp-elf-addr2line' | head -n 1)
          echo "addr2line: $A2L"
          ADDRS=$(echo "$BACKTRACE" | grep -oE '0x[0-9a-fA-F]{8}' | tr '\n' ' ')
          echo "=== DECODED ==="
          "$A2L" -pfiaC -e crash/CamperUI-Radio.elf $ADDRS

      - name: Compile firmware
        if: inputs.backtrace == ''
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli compile --output-dir "$GITHUB_WORKSPACE/build" --fqbn 'esp32:esp32:esp32s3:CPUFreq=240,CDCOnBoot=cdc,PSRAM=opi,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB' CamperUI 2>&1 | tee build/compile.log
          test -s build/CamperUI.ino.bin
          mkdir -p ota
          cp build/CamperUI.ino.bin ota/CamperUI-Radio-OTA.bin
          sha256sum ota/CamperUI-Radio-OTA.bin > ota/SHA256SUMS.txt
          mkdir -p debug
          cp build/CamperUI.ino.elf debug/CamperUI-Radio.elf

      - name: Download for WLAN update
        if: inputs.backtrace == ''
        uses: actions/upload-artifact@v4
        with:
          name: CamperUI-Radio-WLAN-Update
          path: ota/
          if-no-files-found: error

      - name: Debug symbols (for crash backtraces)
        if: inputs.backtrace == ''
        uses: actions/upload-artifact@v4
        with:
          name: CamperUI-Radio-Debug-ELF
          path: debug/
          if-no-files-found: warn

      - name: Build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CamperUI-Radio-Buildprotokoll
          path: build/*.log
          if-no-files-found: warn
